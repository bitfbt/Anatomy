    <!-- Joint markers -->
    <g fill="#071511" stroke="#00e88a" stroke-width="12">
      <circle cx="375" cy="552" r="17"/><circle cx="382" cy="443" r="16"/><circle cx="382" cy="333" r="16"/>
      <circle cx="466" cy="499" r="17"/><circle cx="462" cy="382" r="16"/><circle cx="464" cy="260" r="16"/>
      <circle cx="546" cy="488" r="17"/><circle cx="548" cy="361" r="16"/><circle cx="550" cy="224" r="16"/>
      <circle cx="625" cy="505" r="17"/><circle cx="632" cy="393" r="16"/><circle cx="644" cy="281" r="16"/>
      <circle cx="324" cy="616" r="17"/><circle cx="279" cy="544" r="16"/>
    </g>
  </g>
</svg>
