      <path d="M466 499 L462 382 L464 260"/>
      <path d="M546 488 L548 361 L550 224"/>
      <path d="M625 505 L632 393 L644 281"/>
      <path d="M324 616 L279 544 L293 459"/>
    </g>
    <!-- Palm metacarpals -->
    <g stroke="#bfeedd" stroke-width="23">
      <path d="M375 552 L411 704"/>
      <path d="M466 499 L470 700"/>
      <path d="M546 488 L526 700"/>
      <path d="M625 505 L581 704"/>
      <path d="M324 616 L397 729"/>
    </g>
    <!-- Wrist and carpal cluster -->
    <g stroke="#00e88a" stroke-width="24">
      <path d="M397 729 Q489 766 581 704"/>
      <path d="M428 754 L405 815"/>
      <path d="M554 748 L578 812"/>
