<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10251e"/>
      <stop offset="1" stop-color="#050b09"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#00e88a" stop-opacity=".19"/>
      <stop offset="1" stop-color="#00e88a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="#c9f5e4" stroke-opacity=".08" stroke-width="3"/>
  <circle cx="512" cy="512" r="326" fill="none" stroke="#00e88a" stroke-opacity=".10" stroke-width="2"/>

  <g fill="none" stroke="#e8f6ef" stroke-linecap="round" stroke-linejoin="round">
    <!-- Five clearly separated finger-bone chains -->
    <g stroke-width="25">
